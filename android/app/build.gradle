plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.wheelsofprocrastination.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.wheelsofprocrastination.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so `assembleRelease` produces an
            // APK that installs (and updates in place) from this machine. This
            // app is sideloaded onto family tablets, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The one thing a WebView cannot do for itself: receive a push while closed.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
